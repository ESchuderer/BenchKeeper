services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # rootless podman: map the host uid to the container user node (uid 1000) so the bind mount is writable
    userns_mode: keep-id
    # an init process reaps the exited children of test runs
    init: true
    # WORKSPACE and GIT_COMMON come from .env, written by initializeCommand; host paths are kept so git worktree paths match on both sides
    volumes:
      - ${WORKSPACE}:${WORKSPACE}:cached
      - ${GIT_COMMON}:${GIT_COMMON}
    command: sleep infinity
    environment:
      DO_NOT_TRACK: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
