# Version updates for the `uses:` pins (SHA plus version comment) and the npm packages of the site and the app.
# Not covered, bumped by hand: the actionlint image digest in checks.yml, node-version (checks, links, pages and npm workflows) and
# the Node image of .devcontainer/Dockerfile, which must stay equal to it. Each update waits until the release is 3 days old
# (cooldown): a release withdrawn within that time never reaches a pull request. The CedarLoom packages (pnpm workspace at
# the root) pin typos and Node 26 in .github/workflows/cedarloom.yml, bumped by hand; pnpm in .github/pnpm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      web:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      app:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cedarloom:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /.github/pnpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
