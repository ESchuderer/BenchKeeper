# Version updates for the `uses:` pins (SHA plus version comment) and the site's npm packages. Not covered, bumped by hand: the
# actionlint image digest in checks.yml, and node-version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
