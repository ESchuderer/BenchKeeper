name: Checks

# `checks` is the required check, a gate over the three parallel jobs.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image digest is bumped by hand: Dependabot does not read `run:` lines.
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo docker.io/rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color # 1.7.12
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          inputs: .github
      # rules/global.md, Punctuation: em dash and emoji in tracked text files; vendored skills and lockfiles excluded.
      - name: Forbidden characters
        run: |
          # git grep: 0 match, 1 no match, anything else an error (for example a pattern PCRE rejects).
          rc=0
          git grep -nIP '\x{2014}|[\x{1F000}-\x{1FAFF}\x{2300}-\x{23FF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}]|\x{FE0F}' -- . ':!.agents' ':!.claude' ':!*package-lock.json' ':!*.png' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::em dash or emoji found (rules/global.md, Punctuation)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::git grep failed ($rc)"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      # Own skills: front matter, name, quoted description, size, link targets, Codex policy (AGENTS.md conventions).
      - name: Skill lint
        run: node --test .github/scripts/skill-lint.test.mjs && node .github/scripts/skill-lint.mjs
      - name: PR title pattern
        run: node --test .github/scripts/pr-title.test.mjs
      # library/README.md tables are generated from library.json.
      - name: Library catalog
        run: node --test .github/scripts/library-readme.test.mjs && node .github/scripts/library-readme.mjs --check
      # docs/skills.md tables are generated from the skills' front matter and library.json.
      - name: Skills page
        run: node --test .github/scripts/skills-doc.test.mjs && node .github/scripts/skills-doc.mjs --check
      # Install commands in the docs name the app version (npx benchkeeper@<version>, the clone tag).
      - name: Version pins
        run: node --test .github/scripts/version-pins.test.mjs && node .github/scripts/version-pins.mjs --check
      # Each claim in web/src/data/facts.json names its evidence: a repository file or heading, a test title, or a BenchKeeper-research result.
      - name: Claims evidence
        run: node --test .github/scripts/claims.test.mjs && node .github/scripts/claims.mjs

  # The web UI against a fixture home: request checks are in the app tests, views and axe (light, dark) here.
  app-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Install app packages
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Browser download only: the system packages (apt) are not cached. The step is time-boxed and retried once because the install stalls now and then.
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install the browser
        id: browser
        continue-on-error: true
        timeout-minutes: 4
        working-directory: app
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Install the browser (retry)
        if: steps.browser.outcome != 'success'
        timeout-minutes: 4
        working-directory: app
        # The runner cannot signal a root-owned apt-get that outlives the timed-out step, and it holds the apt lock.
        run: |
          sudo pkill -x apt-get || true
          node_modules/.bin/playwright install --with-deps chromium
      - name: App UI tests
        working-directory: app
        run: npm run build && npm run test:ui

  # The plugin as Claude Code reads it: manifest and skill front matter (strict), the marketplace file, the mod tests. Claude Code is pinned by `.github/claude-code/package-lock.json` (the `stable` tag of its npm package); bump it by hand.
  plugin-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Install Claude Code
        working-directory: .github/claude-code
        # No install scripts: the native binary of the runner's platform package goes on PATH instead of the postinstall copy.
        run: npm ci --ignore-scripts --no-audit --no-fund && echo "$PWD/node_modules/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      - name: Validate the plugin and the marketplace
        run: claude plugin validate plugins/benchkeeper --strict && claude plugin validate .
      - name: Plugin mod tests
        run: claude plugin test plugins/benchkeeper
      # A broken manifest and a broken skill front matter must fail the validation (fixtures built from a valid scratch plugin).
      - name: Validation fixtures
        run: node --test .github/scripts/plugin-validate.test.mjs

  # Required check: passes when all parallel jobs pass.
  checks:
    if: always()
    needs: [checks-core, app-ui-tests, plugin-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "::error::a needed job ended as $r"; exit 1; fi
          done

  # The installer app: engine, steps, CLI and server against temporary home directories with stub agent commands.
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: App tests
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run check:imports && npm run check:baselines && npm run test:coverage && npm run smoke

  # Windows is untested by the owner: start, plan, apply with a ledger run only.
  app-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Smoke test
        working-directory: app
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund && node scripts/smoke.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
