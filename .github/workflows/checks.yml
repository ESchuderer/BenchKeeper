name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo docker.io/rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color # 1.7.12
      # rules/global.md, Forbidden characters: em dash and emoji in tracked text files; vendored skills, lockfiles and
      # recorded benchmark trial data (agent transcripts, apps, model reviews in bench/results/*/round-*) excluded.
      - name: Forbidden characters
        run: |
          # git grep: 0 match, 1 no match, anything else an error (for example a pattern PCRE rejects).
          rc=0
          git grep -nIP '\x{2014}|[\x{1F000}-\x{1FAFF}\x{2300}-\x{23FF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}]|\x{FE0F}' -- . ':!.agents' ':!.claude' ':!*package-lock.json' ':!*.png' ':!bench/results/*/round-*' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::em dash or emoji found (rules/global.md, Forbidden characters)"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "::error::git grep failed ($rc)"; exit 1; fi
      # AGENTS.md: SKILL.md front matter `description` in double quotes (it contains colons).
      - name: SKILL.md front matter
        run: |
          for f in skills/*/SKILL.md; do
            awk 'NR == 1 && $0 != "---" { exit 1 } NR > 1 && $0 == "---" { exit found ? 0 : 1 } /^description: ".*"$/ { found = 1 }' "$f" \
              || { echo "::error file=$f::front matter needs description: \"...\""; exit 1; }
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      - name: OpenSpec
        run: npx -y @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: "0"
