name: npm publish

# Started by the Release workflow after the merge of a release pull request that raises the app version (its job
# `release` waits for this run before it tags), or by the owner (Actions, npm publish, Run workflow). Publishes app/ as benchkeeper@<version> with npm
# provenance through trusted publishing (OIDC): no token. The package's npm settings name this repository and npm.yml.
# The run is on main, but it builds the commit of the input `sha`, the release commit that app-v<version> tags, which
# must be on main: a rerun after later merges publishes the release, not the head of main. npm takes the provenance from
# the run, so when main has moved past `sha` the provenance names the head of main at the dispatch; the run warns then.
# Two jobs: `build` installs the dependencies (lifecycle scripts off), tests and packs, and holds no OIDC token;
# `publish` runs no repository or dependency code, it only downloads that tarball and publishes it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, equal to app/package.json
        required: true
      sha:
        description: Release commit to build, a full commit hash on main (the Release workflow passes the commit it tags)
        required: true

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # HEAD is the head of main; release-workflows.test.mjs runs this block.
      - name: Check out the release commit
        env:
          WANT_SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$WANT_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::sha must be a full commit hash, got '$WANT_SHA'"; exit 1; fi
          if ! git merge-base --is-ancestor "$WANT_SHA" HEAD 2>/dev/null; then echo "::error::$WANT_SHA is not on main"; exit 1; fi
          head=$(git rev-parse HEAD)
          if [ "$head" != "$WANT_SHA" ]; then
            echo "::warning::main moved past $WANT_SHA: the package is built from it, its npm provenance names the head of main $head"
          fi
          git checkout --quiet --detach "$WANT_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Version matches the input
        working-directory: app
        env:
          WANT: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$WANT"
      - name: Install, test and pack
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test && mkdir -p ../pkg && npm pack --pack-destination ../pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkg/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g --ignore-scripts npm@11.21.1 # zizmor: ignore[adhoc-packages] exact version
      - name: Publish the tarball of the input version
        env:
          WANT: ${{ inputs.version }}
        run: |
          test "$(find pkg -type f | wc -l)" = 1
          test -f "pkg/benchkeeper-$WANT.tgz"
          npm publish "./pkg/benchkeeper-$WANT.tgz" --provenance --access public
