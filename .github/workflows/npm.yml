name: npm publish

# Started by the owner only (Actions, npm publish, Run workflow). Publishes app/ as benchkeeper@<version> with npm
# provenance through trusted publishing (OIDC): no token. The package's npm settings name this repository and npm.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, equal to app/package.json
        required: true

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          registry-url: https://registry.npmjs.org
      - name: Version matches the input
        working-directory: app
        env:
          WANT: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$WANT"
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1 # zizmor: ignore[adhoc-packages] exact version
      - name: Test and publish
        working-directory: app
        run: npm ci --no-audit --no-fund && npm test && npm publish --provenance --access public
