name: npm publish

# Started by the owner only (Actions, npm publish, Run workflow). Publishes app/ as benchkeeper@<version> with npm
# provenance. Needs the repository secret NPM_TOKEN (an npm automation token for the benchkeeper package).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, equal to app/package.json
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          registry-url: https://registry.npmjs.org
      - name: Version matches the input
        working-directory: app
        env:
          WANT: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$WANT"
      - name: Test and publish
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci --no-audit --no-fund && npm test && npm publish --provenance --access public
