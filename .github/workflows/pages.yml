name: Pages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# Pushes and manual runs share one group and queue (one running, the newest pending): one run at a time keeps an older snapshot from replacing a newer one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node scripts/readme.mjs --check
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The browser alone, without --with-deps: the runner image has the libraries Chromium needs, and the apt install of fonts
      # the tests do not use stalled at the Ubuntu mirror. Playwright retries its own download. No browser cache here, this
      # workflow publishes the site (cache poisoning).
      - name: Install the browser
        timeout-minutes: 4
        run: node_modules/.bin/playwright install chromium
      - run: npm test
      # The bundle job deploys main under /BenchKeeper/next/: build and test that edition too.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_EDITION: next
      - run: npm test
        env:
          SITE_EDITION: next

  # The site root shows the latest GitHub Release, built from its tag; /next/ shows main. A Pages deployment replaces the
  # whole site, so this job builds both into one artifact. The Release workflow starts this workflow after it creates a
  # release (a release made with GITHUB_TOKEN starts no `release` run). A failing build or check job keeps the previous
  # deployment.
  bundle:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false # the release event runs this job; no cache that a pull request could have written
      - name: Build main for /next/
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts
          SITE_EDITION=next npm run build
      - name: Build the latest release for the root
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then
            mkdir site
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=next/"><title>BenchKeeper</title><a href="next/">BenchKeeper</a>\n' > site/index.html
          else
            git fetch --depth 1 --no-tags "https://github.com/$REPO.git" "refs/tags/$tag:refs/tags/$tag"
            git worktree add --detach "$RUNNER_TEMP/release" "$tag"
            (cd "$RUNNER_TEMP/release/web" && npm ci --ignore-scripts && npm run build)
            mv "$RUNNER_TEMP/release/web/dist" site
          fi
          mv web/dist site/next
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
