name: Promote

# Keeps one open pull request from develop to main; merging it is the release (ESchuderer/repo-baseline).
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    permissions:
      contents: read
      pull-requests: write
    uses: ESchuderer/repo-baseline/.github/workflows/promote.yml@9480c9d88cc22eeafe858bb548b39d7090133ea9 # v0.1.0
