name: Release

# The plugin version in plugins/benchkeeper/*/plugin.json is the setup version (CHANGELOG.md).
# Pull requests: a change under plugins/benchkeeper/ raises it and adds its CHANGELOG entry.
# main: the first push with a new version tags setup-v<major>.<minor>, moves the branch stable (the ref the app adds
# BenchKeeper's marketplace at) to that commit, and publishes a GitHub Release (titled benchkeeper <major>.<minor>) with that entry.
# Then, if npm does not have app/package.json's version yet, it starts npm.yml, which publishes it: merge to main is the release.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Skips only the promotion pull request (this repository's develop into main), whose jobs the push to develop already ran; a fork branch named develop is not skipped.
    if: ${{ github.event_name == 'pull_request' && !(github.head_ref == 'develop' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: release.sh self-check
        run: sh .github/scripts/release.test.sh
      - name: Version and CHANGELOG entry
        run: sh .github/scripts/release.sh check "origin/$GITHUB_BASE_REF"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history: the push to stable must find stable's commit here to fast-forward it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the job pushes stable with these credentials
          fetch-depth: 0
      - name: Tag and GitHub Release
        run: |
          tag=$(sh .github/scripts/release.sh tag)
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          # Before the release, so a rerun after a failed release still moves it; main is linear, so this fast-forwards.
          git push origin "$GITHUB_SHA:refs/heads/stable"
          sh .github/scripts/release.sh notes > "$RUNNER_TEMP/notes.md"
          # An existing tag (pushed by hand) is kept; otherwise the tag is created on this commit.
          gh release create "$tag" --target "$GITHUB_SHA" --title "benchkeeper ${tag#setup-v}" --notes-file "$RUNNER_TEMP/notes.md"

  npm:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: app/package.json
          sparse-checkout-cone-mode: false
      # npm.yml holds the trusted-publisher binding and the OIDC token; this job can only start it. Events made with
      # GITHUB_TOKEN do not start workflows, except a dispatch. A push to main without a new version, or a rerun after
      # a published version, finds the version on npm and does nothing; a failed publish is retried by rerunning this job.
      - name: Start npm publish for a new version
        run: |
          v=$(jq -r .version app/package.json)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://registry.npmjs.org/benchkeeper/$v")
          case $code in
            200) echo "benchkeeper@$v is on npm" ;;
            404) gh workflow run npm.yml --ref main -f "version=$v" ;;
            *) echo "::error::registry answered $code for benchkeeper@$v"; exit 1 ;;
          esac
