name: Release

# Nothing releases until the owner merges the release pull request (docs/releasing.md). release-please keeps one release
# pull request open from the Conventional Commits on main (release-please-config.json, two components: the app under
# app/, tag app-v<x.y.z>, and the content under plugins/benchkeeper/, tag setup-v<x.y>). It creates no tag or Release:
# after the merge the job `release` publishes the app to npm through npm.yml (built from the release commit, the commit
# the tags name, also when main has moved on) and waits for the registry, and only then
# tags, creates the GitHub Releases, moves the branch stable (the ref the app adds BenchKeeper's marketplace at) and
# rebuilds the site. A failed publish creates no tag or Release and moves nothing; rerun the job after the fix.
#
# The release pull request opens with the release GitHub App token so that its required checks run without approval
# (a pull request changed with GITHUB_TOKEN starts no runs until someone approves them). Set the variable
# RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY. Without them the job falls back to GITHUB_TOKEN: the
# owner then approves the runs on the release pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Concurrency is per job, not per workflow: GitHub keeps one pending run per group and cancels the one waiting before
# it, and only the run of the release merge releases, so a later push must not cancel it.
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pending release-please job that a newer push replaces is dropped: the newer one does the same work.
    concurrency:
      group: ${{ github.workflow }}-release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      REPO: ${{ github.repository }}
    steps:
      - id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          skip-github-release: true
      # release-please bumps the versions in the files it knows; the install commands in the docs name the app version
      # (version-pins.mjs, checked in checks.yml), so the release pull request gets them in one more commit. The
      # next release-please run rebuilds the branch, and this step runs again.
      - id: pr
        name: Find the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          branch=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.pr.outputs.branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the next step pushes to the release branch with these credentials
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          path: release-pr
      - if: ${{ steps.pr.outputs.branch != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - if: ${{ steps.pr.outputs.branch != '' }}
        name: Pin the install commands to the release version
        working-directory: release-pr
        run: |
          node .github/scripts/version-pins.mjs --release
          if git diff --quiet; then echo "Pins are current."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -a -m 'chore: pin the install commands to the release version'
          git push

  # The merge of the release pull request: the components whose version changed in .release-please-manifest.json
  # release. Every step skips what a previous run did, so rerunning the job after a failure continues where it stopped.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One group per commit: a push after the release merge never cancels this job, and a rerun waits for a running one.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - id: pr
        name: Find the merged release pull request
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))][0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.pr.outputs.number != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the job pushes stable with these credentials
          fetch-depth: 0
      - id: v
        if: ${{ steps.pr.outputs.number != '' }}
        name: Versions to release
        run: |
          now=$(jq -c . .release-please-manifest.json)
          before=$(git show HEAD^:.release-please-manifest.json | jq -c .)
          app=$(jq -r .app <<<"$now")
          content=$(jq -r '."plugins/benchkeeper"' <<<"$now")
          [ "$app" != "$(jq -r .app <<<"$before")" ] && echo "app=$app" >> "$GITHUB_OUTPUT"
          [ "$content" != "$(jq -r '."plugins/benchkeeper"' <<<"$before")" ] && echo "content=$content" >> "$GITHUB_OUTPUT"
          true
      # npm.yml holds the trusted-publisher binding and the OIDC token; this job can only start it (a dispatch is the
      # one event GITHUB_TOKEN may start a workflow with) and wait for it. A dispatch runs on the head of main, so it
      # gets the release commit as `sha` and builds that. A version that npm already has is not published again.
      - if: ${{ steps.v.outputs.app != '' }}
        name: Publish the app to npm and verify the registry
        env:
          V: ${{ steps.v.outputs.app }}
        run: |
          registry() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://registry.npmjs.org/benchkeeper/$V"; }
          code=$(registry)
          if [ "$code" = 404 ]; then
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run npm.yml --repo "$REPO" --ref main -f "version=$V" -f "sha=$SHA"
            run=
            for _ in $(seq 30); do
              sleep 10
              run=$(gh run list --repo "$REPO" --workflow npm.yml --event workflow_dispatch --created ">=$since" --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$run" ] && break
            done
            if [ -z "$run" ]; then echo "::error::npm.yml did not start"; exit 1; fi
            gh run watch "$run" --repo "$REPO" --exit-status --interval 30
            # The registry can answer 404 for a short time after the publish.
            for _ in $(seq 20); do
              code=$(registry)
              [ "$code" = 200 ] && break
              sleep 15
            done
          fi
          if [ "$code" != 200 ]; then echo "::error::registry answered $code for benchkeeper@$V"; exit 1; fi
          echo "benchkeeper@$V is on npm"
      # release-please finds a component's last release by the tag <component>-v<x.y.z>: content gets setup-v<x.y.0>
      # for it and the Release on setup-v<x.y>, the tag that the docs and older releases use.
      - if: ${{ steps.v.outputs.app != '' || steps.v.outputs.content != '' }}
        name: Tag and create the GitHub Releases
        env:
          APP: ${{ steps.v.outputs.app }}
          CONTENT: ${{ steps.v.outputs.content }}
        run: |
          notes() { awk '/^## /{if (f) exit; f=1; next} f' "$1"; }
          release() {
            gh release view "$1" --repo "$REPO" >/dev/null 2>&1 && return
            gh release create "$1" --repo "$REPO" --target "$SHA" --title "$2" --notes "$(notes "$3")" --latest
          }
          if [ -n "$APP" ]; then release "app-v$APP" "app v$APP" app/CHANGELOG.md; fi
          if [ -n "$CONTENT" ]; then
            gh api "repos/$REPO/git/ref/tags/setup-v$CONTENT" >/dev/null 2>&1 ||
              gh api "repos/$REPO/git/refs" -f "ref=refs/tags/setup-v$CONTENT" -f "sha=$SHA" >/dev/null
            release "setup-v${CONTENT%.0}" "setup v${CONTENT%.0}" plugins/benchkeeper/CHANGELOG.md
          fi
      # stable only moves forward: main is linear, so this fast-forwards, and a rerun finds it in place.
      - if: ${{ steps.v.outputs.app != '' || steps.v.outputs.content != '' }}
        name: Move stable to the release commit
        run: git push origin "$SHA:refs/heads/stable"
      # A Release made with GITHUB_TOKEN starts no `release` run of pages.yml.
      - if: ${{ steps.v.outputs.app != '' || steps.v.outputs.content != '' }}
        name: Rebuild the site
        run: gh workflow run pages.yml --repo "$REPO" --ref main
      # release-please opens no new release pull request while a merged one is still pending.
      - if: ${{ steps.pr.outputs.number != '' }}
        name: Mark the release pull request as tagged
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
