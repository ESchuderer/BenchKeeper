name: Release

# The plugin version in plugins/benchkeeper/*/plugin.json is the setup version (CHANGELOG.md).
# Pull requests: a change under plugins/benchkeeper/ raises it and adds its CHANGELOG entry.
# main: the first push with a new version tags setup-v<major>.<minor>, moves the branch stable (the ref the app adds
# BenchKeeper's marketplace at) to that commit, and publishes a GitHub Release with that entry.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: release.sh self-check
        run: sh .github/scripts/release.test.sh
      - name: Version and CHANGELOG entry
        run: sh .github/scripts/release.sh check "origin/$GITHUB_BASE_REF"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag and GitHub Release
        run: |
          tag=$(sh .github/scripts/release.sh tag)
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          # Before the release, so a rerun after a failed release still moves it; main is linear, so this fast-forwards.
          git push origin "$GITHUB_SHA:refs/heads/stable"
          sh .github/scripts/release.sh notes > "$RUNNER_TEMP/notes.md"
          # An existing tag (pushed by hand) is kept; otherwise the tag is created on this commit.
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
