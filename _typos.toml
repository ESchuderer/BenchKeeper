# US spelling in the CedarLoom packages (the typos job of .github/workflows/cedarloom.yml checks packages/ only).
[default]
locale = "en-us"

# Names of tools, not English words: axe-core and its AxeBuilder.
[default.extend-words]
axe = "axe"
Axe = "Axe"

# A DOM property, spelled as the platform spells it.
[default.extend-identifiers]
ariaLabelledByElements = "ariaLabelledByElements"

# Recorded session logs: ids, not words. Mantine's skill: copied unchanged, so its spelling is upstream's.
[files]
extend-exclude = ["packages/sessions/test/fixtures/", "packages/packs/bundled/cedarloom.mantine/skills/mantine-form/"]
