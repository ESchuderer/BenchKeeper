# CedarLoom packages. app/ and web/ stay npm projects with their own lockfiles.
packages:
  - packages/*

# A version must be 3 days old before an install resolves to it (the Dependabot cooldown, applied to transitive packages too).
minimumReleaseAge: 4320
strictPeerDependencies: true

# openapi-typescript builds its output with the TypeScript compiler API, which TypeScript 7 does not have yet; it runs
# on the TypeScript 6 compatibility package (packages/client), whose 6.x its peer range of 5.x does not name.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# One version per shared dependency: packages name it as "catalog:".
catalog:
  fast-check: 4.10.2
  zod: 4.6.7

# shortcut: thread-stream 4.2.0 (pino, through fastify) names a worker_threads type that @types/node 26 removed, which
# tsc reports with skipLibCheck off; 4.2.1 has the same one-line fix. Drop the patch when the lockfile moves to 4.2.1.
patchedDependencies:
  thread-stream@4.2.0: patches/thread-stream@4.2.0.patch
